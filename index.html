                                                                navigator.clipboard.writeText(peerId);
                                                                alert('IDをコピーしました！');
                                                            }}
                                                            className={`w-16 h-16 ${peerId ? 'bg-blue-600 hover:bg-blue-500' : 'bg-slate-700 cursor-not-allowed'} text-white rounded-2xl transition-all shadow-lg flex items-center justify-center group-hover:scale-105 active:scale-95 border-b-4 border-blue-800`}
                                                            title="IDをコピー"
                                                        >
                                                            <i className="fas fa-copy text-2xl"></i>
                                                        </button>
                                                    </div>
                                                    <p className="text-xs text-slate-500 mt-4 font-bold flex items-center justify-center gap-2">
                                                        <span className={`w-2 h-2 rounded-full ${peerId ? 'bg-green-500 animate-pulse' : 'bg-yellow-500'}`}></span>
                                                        {detailedStatus || (peerId ? '待機中...' : 'サーバーに接続しています')}
                                                    </p>
                                                    {peerId && (
                                                        <div className="mt-4 pt-4 border-t border-white/5">
                                                            <p className="text-xs text-slate-500 font-bold mb-2">
                                                                接続済み人数: {connections.length + 1}人
                                                            </p>
                                                            <div className="flex flex-wrap gap-2 justify-center">
                                                                <span className="text-[9px] px-2 py-0.5 bg-amber-500/20 text-amber-500 rounded border border-amber-500/30">Host: {peerId}</span>
                                                                {connections.map(c => (
                                                                    <span key={c.peer} className="text-[9px] px-2 py-0.5 bg-blue-500/20 text-blue-500 rounded border border-blue-500/30">Client: {c.peer}</span>
                                                                ))}
                                                            </div>
                                                        </div>
                                                    )}
                                                </div>
                                            )}

                                            {(!isOnline || isHost) && (
                                                <div className="space-y-12">
                                                    <div className="space-y-8">
                                                        <h2 className="text-[10px] font-black text-slate-500 uppercase tracking-[0.4em] opacity-40">ゲームモード</h2>
                                                        <div className="flex justify-center gap-8">
                                                            <button onClick={() => setGameMode('basic')} className={`px-10 py-6 rounded-2xl border transition-all ${gameMode === 'basic' ? 'bg-amber-500 text-slate-950 border-amber-400 shadow-lg' : 'bg-slate-800 text-slate-400 border-white/5'}`}>基本ルール</button>
                                                            <button onClick={() => setGameMode('cities')} className={`px-10 py-6 rounded-2xl border transition-all ${gameMode === 'cities' ? 'bg-blue-500 text-slate-950 border-blue-400 shadow-lg' : 'bg-slate-800 text-slate-400 border-white/5'}`}>都市ルール</button>
                                                        </div>
                                                    </div>
                                                    {gameMode && (
                                                        <div className="space-y-8 animate-in fade-in">
                                                            <h2 className="text-[10px] font-black text-slate-500 uppercase tracking-[0.4em] opacity-40">プレイヤー人数</h2>
                                                            <div className="flex justify-center gap-6">
                                                                {[2, 3, 4].map(num => {
                                                                    const connectedCount = connections.length + 1;
                                                                    const isDisabled = isOnline && num !== connectedCount;
                                                                    return (
                                                                        <button
                                                                            key={num}
                                                                            onClick={() => startGame(num, gameMode)}
                                                                            disabled={isDisabled}
                                                                            className={`w-20 h-20 rounded-2xl border transition-all text-2xl font-black ${isDisabled
                                                                                ? 'bg-slate-900 border-slate-800 text-slate-700 opacity-50 cursor-not-allowed'
                                                                                : 'bg-slate-800 border-white/5 hover:border-amber-500/50 text-white hover:scale-110'
                                                                                }`}
                                                                        >
                                                                            {num}
                                                                        </button>
                                                                    );
                                                                })}
                                                            </div>
                                                        </div>
                                                    )}
                                                </div>
                                            )}

                                            {!isHost && isOnline && connStatus === 'connected' && (
                                                <div className="p-12 text-center space-y-6 animate-pulse">
                                                    <i className="fas fa-spinner fa-spin text-4xl text-blue-500"></i>
                                                    <p className="text-xl font-bold text-white uppercase tracking-widest">ホストがゲームを開始するのを待っています...</p>
                                                </div>
                                            )}
                                        </div>
                                    ) : connStatus === 'connecting' ? (
                                        <div className="p-12 text-center space-y-6">
                                            <i className="fas fa-circle-notch fa-spin text-6xl text-purple-500"></i>
                                            <p className="text-2xl font-bold text-white uppercase tracking-widest">接続中...</p>
                                            <div className="space-y-2">
                                                <p className="text-sm text-slate-500 font-bold animate-pulse">{detailedStatus}</p>
                                                <p className="text-[10px] text-slate-600 font-mono">My ID: {peerId || 'waiting...'}</p>
                                                <p className="text-[10px] text-slate-600 font-mono">Target: {targetPeerId}</p>
                                            </div>
                                        </div>
                                    ) : connStatus === 'error' && (
                                        <div className="premium-panel p-12 text-center space-y-6">
                                            <i className="fas fa-exclamation-triangle text-6xl text-red-500"></i>
                                            <p className="text-2xl font-bold text-white uppercase tracking-widest">接続に失敗しました</p>
                                            <p className="text-sm text-red-400 font-bold mb-4">{detailedStatus}</p>
                                            <button onClick={() => { setConnStatus('idle'); setDetailedStatus(''); isConnectingRef.current = false; }} className="px-8 py-4 bg-slate-700 text-white rounded-xl font-bold">タイトルに戻る</button>
                                        </div>
                                    )}
                                </div>
                            </div>
                        </div>
                    )}
                    {/* Gold Usage Confirmation Modal */}
                    {purchaseTarget && (
                        <GoldConfirmationModal
                            target={purchaseTarget}
                            playerGems={player.gems}
                            playerDiscounts={playerDiscounts}
                            onConfirm={(payment, gold) => {
                                finalizePurchase(purchaseTarget, payment, gold);
                                setPurchaseTarget(null);
                            }}
                            onCancel={() => setPurchaseTarget(null)}
                        />
                    )}

                    {/* Discard Overlay for Over-limit Tokens */}
                    {Object.values(player.gems).reduce((a, b) => a + b, 0) > 10 && (
                        <div className="fixed inset-0 bg-slate-950/90 backdrop-blur-md flex items-center justify-center z-[150] animate-in fade-in duration-300">
                            <div className="bg-slate-800 border-2 border-red-500/50 rounded-3xl p-10 max-w-lg w-full shadow-[0_0_50px_rgba(239,68,68,0.3)] text-center">
                                <div className="w-20 h-20 bg-red-500 rounded-full flex items-center justify-center mx-auto mb-6 animate-pulse">
                                    <i className="fas fa-hand-holding-usd text-3xl text-white"></i>
                                </div>
                                <h2 className="text-3xl font-black mb-2 text-white uppercase italic">所持上限オーバー！</h2>
                                <p className="text-slate-400 mb-8 font-bold">10枚になるまで戻却するトークンを選んでください</p>

                                <div className="flex justify-center gap-4 mb-8 flex-wrap">
                                    {ALL_GEMS.map(color => {
                                        const count = player.gems[color];
                                        if (count === 0) return null;
                                        return (
                                            <div key={`discard-modal-${color}`} className="flex flex-col items-center gap-2">
                                                <button
                                                    onClick={() => {
                                                        const newPlayerGems = { ...player.gems };
                                                        const newSupply = { ...supply };
                                                        newPlayerGems[color]--;
                                                        newSupply[color]++;

                                                        const newPlayers = [...players];
                                                        newPlayers[currentPlayerIndex] = { ...player, gems: newPlayerGems };

                                                        const total = Object.values(newPlayerGems).reduce((a, b) => a + b, 0);
                                                        if (total === 10) {
                                                            endTurn(newPlayers[currentPlayerIndex], { supply: newSupply });
                                                            setDiscardGems([]);
                                                            setSelectedGems([]);
                                                            setIsReserving(false);
                                                        } else {
                                                            setSupply(newSupply);
                                                            setPlayers(newPlayers);
                                                        }
                                                    }}
                                                    className={`w-14 h-14 rounded-full ${GEM_COLORS[color]} border-b-4 flex items-center justify-center text-xl font-black shadow-lg hover:scale-110 active:scale-95 transition-transform`}
                                                >
                                                    {count}
                                                </button>
                                                <span className="text-[10px] text-slate-500 font-black uppercase">
                                                    {{ white: '白', blue: '青', green: '緑', red: '赤', black: '黒', gold: '黄金' }[color]}
                                                </span>
                                            </div>
                                        );
                                    })}
                                </div>

                                <div className="bg-slate-900/80 rounded-2xl p-4 border border-slate-700">
                                    <p className="text-xl font-black text-amber-400">
                                        現在の所持数: <span className="text-white">{Object.values(player.gems).reduce((a, b) => a + b, 0)}</span> / 10
                                    </p>
                                </div>

                                {lastActionSnapshot && (
                                    <button
                                        onClick={() => {
                                            setSupply(lastActionSnapshot.supply);
                                            const newPlayers = [...players];
                                            newPlayers[currentPlayerIndex] = {
                                                ...player,
                                                gems: lastActionSnapshot.playerGems,
                                                reservedCards: lastActionSnapshot.cardReserved ? player.reservedCards.slice(0, -1) : player.reservedCards
                                            };
                                            if (lastActionSnapshot.visibleCards) setVisibleCards(lastActionSnapshot.visibleCards);
                                            if (lastActionSnapshot.decks) setDecks(lastActionSnapshot.decks);

                                            setPlayers(newPlayers);
                                            setLastActionSnapshot(null);
                                            setDiscardGems([]);
                                            setSelectedGems([]);
                                            setIsReserving(false);
                                        }}
                                        className="mt-6 w-full py-4 bg-slate-700 hover:bg-slate-600 text-slate-300 rounded-2xl font-black uppercase tracking-widest transition-all flex items-center justify-center gap-2"
                                    >
                                        <i className="fas fa-undo"></i> 取った宝石を全て戻して選び直す
                                    </button>
                                )}
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>

</html>
